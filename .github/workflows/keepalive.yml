name: Keep Hugging Face Space Awake

# Objetivo: mantém o app (Hugging Face Space) "acordado" durante o horário
# comercial da Doces Vó Nena (7h-19h horário Brasil, seg a sáb).
#
# O app foi migrado do Streamlit Community Cloud para o Hugging Face Spaces.
# Spaces no free tier hibernam após um período sem acesso — quando alguém abre
# depois disso, paga um "cold start" (o container precisa subir de novo: carregar
# Python, importar libs, pré-aquecer o pool Postgres, etc), que leva dezenas de
# segundos. Um GET periódico no endereço do Space conta como atividade e evita
# que ele durma durante o expediente.
#
# IMPORTANTE: o endereço abaixo é o do Space no HF (…hf.space), NÃO mais o antigo
# pcp-vo-nena.streamlit.app (que está morto). Se o Space for renomeado/movido,
# atualizar APP_URL aqui.
#
# Custo: GitHub Actions é gratuito para repositórios públicos. Para repo privado:
# até 2.000 minutos/mês free — cada execução leva ~10-30s, bem abaixo do limite.
#
# Limitações conhecidas:
# - GitHub pode atrasar workflows agendados em 5-15 min (não é crítico).
# - O cron é em UTC. Brasil = UTC-3 (sem horário de verão atualmente).
#
# Como pausar: github.com/leonardosoglia/pcp-vo-nena → Actions → este workflow →
# "..." → Disable workflow. Ou deletar este arquivo.

on:
  schedule:
    # Cron em UTC. Brasil = UTC-3. Horário comercial Vó Nena = 7h-19h BR = 10h-22h UTC.
    # Roda a cada 15 minutos, das 10h às 22h UTC, segunda a sábado.
    - cron: '*/15 10-21 * * 1-6'

  # Permite disparar manualmente (Actions → Run workflow) pra testar ou acordar o
  # app fora do horário agendado.
  workflow_dispatch:

# Cancela execuções pendentes se uma nova for disparada (evita acúmulo).
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # se travar, não fica pendurado

    steps:
      - name: Ping Space
        run: |
          APP_URL="https://leonardosoglia-pcp-vo-nena.hf.space/"
          echo "Pingando $APP_URL em $(date -u +%FT%TZ)"

          # Notas técnicas:
          # - -L segue redirect (o HF pode redirecionar pro app embutido).
          # - -s silent · -o /dev/null descarta corpo · -w imprime status/tempo.
          # - --max-time 90: o cold start do HF (subir container) pode levar
          #   bastante; damos folga pra a requisição efetivamente acordar o Space.
          RESULT=$(curl -sL -o /dev/null \
            --max-time 90 \
            -w "HTTP=%{http_code} TIME=%{time_total}s" \
            "$APP_URL" || true)

          echo "Resultado: $RESULT"

          STATUS=$(echo "$RESULT" | grep -oE 'HTTP=[0-9]+' | grep -oE '[0-9]+')

          case "$STATUS" in
            200|301|302|303|307|308)
              echo "App respondeu (HTTP $STATUS) — atividade registrada, Space acordado."
              ;;
            "")
              echo "Sem resposta (timeout ou rede). Próxima execução tenta de novo."
              ;;
            *)
              echo "Status inesperado: $STATUS"
              ;;
          esac

          # Sempre exit 0 — falha de keepalive não é crítica; a próxima execução
          # (em ~15 min) tenta de novo.
          exit 0
