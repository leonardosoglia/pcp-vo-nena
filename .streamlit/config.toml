# Configuração do Streamlit (não contém secrets — pode commitar).
#
# [theme] força o tema LIGHT independente da preferência do navegador/SO do
# usuário. Antes: Streamlit detectava o "dark mode" do sistema/celular e
# aplicava automaticamente, deixando algumas fontes ilegíveis nas tabelas
# customizadas do app. Padronizar em light é mais simples + consistente
# com a identidade visual Vó Nena (laranja + creme).
#
# Se quiser oferecer toggle dark/light no futuro, remover esse bloco e
# implementar via query param ou session_state.

[theme]
base = "light"
primaryColor = "#C05621"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F9FAFB"
textColor = "#111827"
font = "sans serif"

# Sidebar escura declarada AQUI (tema nativo), não só no CSS do ui_theme.
# Motivo: o esqueleto de carregamento do Streamlit usa o tema nativo — sem
# isto, a sidebar nascia CLARA e "piscava" pra escura quando o CSS chegava
# (flash visível a cada abertura; gravação do Leonardo em 02/07/2026).
[theme.sidebar]
base = "dark"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
primaryColor = "#C05621"

[client]
# DESLIGA a lista automática de páginas na sidebar. O menu do app é montado à
# mão no app.py (grupos-sanfona via st.page_link); a lista automática só
# aparecia no ESQUELETO de carregamento — a cada troca de tela, o navegador
# desenhava a lista crua dos arquivos ("app", "Admin Seed", "Media Movel"...)
# por 1-2s até o menu próprio chegar (flash gravado pelo usuário em 06/07/2026).
showSidebarNavigation = false

[browser]
# Não envia telemetria do uso pro Streamlit
gatherUsageStats = false

[server]
# Upload de arquivo (file_uploader) atras do proxy do Hugging Face:
# a protecao XSRF do Streamlit valida um token que o proxy do HF nao repassa,
# derrubando o POST de upload com HTTP 403 (AxiosError visto em 06/07/2026 na
# aba Importar do SIGE). Desligar a XSRF libera o upload. Risco baixo: app
# interno, sem acoes destrutivas por GET; CORS segue ligado.
enableXsrfProtection = false
